<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR SELIS FARRASAZZAM</title>
    
    <!-- KODE PWA AGAR BISA DI-INSTALL SEBAGAI APLIKASI DI HP -->
    <meta name="theme-color" content="#7f1d1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* TEMA LUXURY BURGUNDY & CREAM (Layout 100% Sama dengan BJRental) */
        body { font-family: 'Inter', Arial, sans-serif; background: #fffbeb; padding: 15px; margin:0; text-align: center; min-height: 100vh; display: flex; flex-direction: column; color: #451a03; }
        
        .header-section { background: #7f1d1d; color: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 10px 25px rgba(127,29,29,0.15); margin-bottom: 15px; }
        .omzet-label { font-size: 13px; font-weight: bold; color: #fca5a5; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        .omzet-value { font-size: 46px; font-weight: 900; color: #ffffff; margin-bottom: 12px; }
        .pekan-box { border-top: 1px dashed #991b1b; padding-top: 12px; font-size: 14px; color: #fde68a; }
        .pekan-value { font-size: 22px; font-weight: 900; color: #fcd34d; }
        
        .refresh-section { background: transparent; display:flex; gap:10px; margin-bottom: 15px; }
        .btn-refresh { background: white; color: #7f1d1d; border: 1px solid #fde68a; flex: 1.2; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 16px; box-shadow: 0 4px 6px rgba(127,29,29,0.05); }
        .btn-servis { background: white; color: #dc2626; border: 1px solid #fde68a; flex: 0.8; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 16px; box-shadow: 0 4px 6px rgba(127,29,29,0.05); }
        .btn-refresh:active, .btn-servis:active { transform: scale(0.98); }
        
        .input-box { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid #fcd34d; font-size: 20px; margin-bottom: 20px; box-sizing: border-box; text-align: center; text-transform: uppercase; font-weight: bold; background: white; color: #451a03; outline: none; }
        .input-box:focus { border-color: #b45309; }
        
        /* KARTU UNIT */
        .card { background: white; border-radius: 16px; margin-bottom: 15px; border: 1px solid #fde68a; border-left: 8px solid #7f1d1d; box-shadow: 0 4px 15px rgba(127,29,29,0.05); padding: 16px; display: flex; flex-direction: column; }
        .unit-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #fef3c7; padding-bottom: 12px; margin-bottom: 12px; z-index: 10; }
        .unit-title { font-weight: 900; font-size: 17px; color: #7f1d1d; text-align: left; line-height: 1.3; }
        .unit-id-text { font-size: 13px; color: #b45309; font-weight: bold; }
        
        .btn-actions { display: flex; gap: 8px; align-items: center; }
        .btn-power { background: #451a03; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-teknis { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; font-size: 20px; cursor: pointer; padding: 8px 12px; color: #b45309; }
        .btn-power:active, .btn-teknis:active { transform: scale(0.95); }
        
        .body-area { position: relative; min-height: 85px; display: flex; flex-direction: column; justify-content: center; }
        
        .overlay { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background: white; z-index:5; align-items: center; justify-content: space-between; border-radius: 12px; box-sizing: border-box; }
        .zona-kiri { flex: 1.3; text-align: left; overflow: hidden; line-height: 1.3; padding-left: 5px; }
        .zona-tengah { flex: 0.7; display: flex; justify-content: center; align-items: center; } 
        .zona-kanan { flex: 1.1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-right: 5px; }
        
        .btn-stop { background: #dc2626; width: 75px; height: 65px; border-radius: 14px; color: white; font-weight: 900; border:none; cursor:pointer; font-size: 18px; box-shadow: 0 4px 0 #991b1b; }
        .btn-stop:active { transform: translateY(4px); box-shadow: none; }
        
        .timer-badge { background: #fde68a; color: #7f1d1d; padding: 8px 5px; border-radius: 10px; font-weight: 900; font-size: 22px; width: 95px; text-align: center; border: 1px solid #fcd34d; }
        .telat { background: #dc2626 !important; color: white !important; border-color: #991b1b !important; animation: blinker 0.8s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
        
        .btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-harga { border: none; padding: 18px 0; border-radius: 14px; color: white; font-weight: 900; cursor: pointer; font-size: 18px; line-height: 1.3; transition: transform 0.1s; }
        .btn-harga:active { transform: scale(0.97); }
        .k1 { background: #f59e0b; } .k2 { background: #ea580c; } .k3 { background: #be123c; } .k4 { background: #451a03; }
        
        #popup, #popup-teknis, #popup-nakal, #layarServis, #popup-stop, #popup-stop-teknis, #popup-input { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 1000; background: rgba(69,26,3,0.85); padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
        .box-popup { background: white; padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; color: #451a03; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .btn-tek { width:100%; padding:16px; border:none; border-radius:14px; font-weight:900; font-size:16px; margin-bottom:12px; cursor:pointer; }
        .btn-kembali { width:100%; padding:18px; background:#fef3c7; color:#7f1d1d; border:1px solid #fde68a; border-radius:14px; font-weight:900; font-size:16px; cursor:pointer; margin-top:10px; }
        .warn-timer { color: #dc2626; font-weight: 900; font-size: 22px; margin: 15px 0; animation: blinker 0.6s linear infinite; }
    </style>
</head>
<body onload="muat()">
    
    <div class="header-section">
        <!-- NAMA UTAMA KECIL, CABANG BESAR -->
        <div style="font-size:13px; font-weight:bold; letter-spacing: 2px; color: #fde68a; margin-bottom: 2px;">SELIS BANG AJI</div>
        <div style="font-size:20px; font-weight:900; margin-bottom:15px; letter-spacing: 1px;">FARRASAZZAM</div>
        <div class="omzet-label">Omzet Hari Ini</div>
        <div class="omzet-value" id="total">Rp 0</div>
        <div class="pekan-box">
            PEKAN INI: <span class="pekan-value" id="total-pekan">Rp 0</span>
        </div>
    </div>
    
    <div class="refresh-section">
        <button class="btn-refresh" onclick="muat()">🔄 REFRESH</button>
        <button class="btn-servis" onclick="document.getElementById('layarServis').style.display='flex'">📋 SERVIS</button>
    </div>
    
    <input type="text" id="nama" class="input-box" placeholder="NAMA PENYEWA...">
    <div id="cont"></div>
    
    <!-- POPUP & SERVIS -->
    <div id="layarServis"><div class="box-popup" style="max-height:85%; overflow-y:auto;"><h2 style="border-bottom:2px dashed #fde68a; padding-bottom:15px; color:#dc2626; margin-top:0;">📋 UNIT SERVIS</h2><div id="daftarRusak" style="text-align:left; font-size:15px;"></div><button class="btn-kembali" onclick="document.getElementById('layarServis').style.display='none'">⬅️ KEMBALI</button></div></div>
    <div id="popup"><div class="box-popup" style="text-align:center;"><h2 style="color:#059669; margin-top:0;">✅ BERHASIL</h2><div class="warn-timer">⚠️ KASIH TIMER KE SEPEDA!</div><p style="font-weight:bold; color:#92400e; margin-bottom:5px;">KEMBALI JAM:</p><h1 id="jam-display" style="font-size:75px; color:#451a03; margin:5px 0 20px 0;">--:--</h1><button onclick="tutupPopup()" style="padding:20px; background:#059669; color:white; border:none; border-radius:16px; font-weight:900; font-size:18px; cursor:pointer; width:100%;">S U D A H !</button></div></div>
    <div id="popup-stop"><div class="box-popup" style="text-align:center;"><h2 style="color:#dc2626; margin-top:0;">⚠️ PERHATIAN!</h2><div class="warn-timer" style="font-size:26px;">AMBIL TIMER DARI SEPEDA!</div><h3 style="margin-top:20px; margin-bottom: 25px; color:#451a03;">Selesaikan Unit <span id="stop-unit-id" style="color:#ea580c; font-weight:900;"></span>?</h3><button onclick="eksekusiStop()" style="padding:18px; background:#dc2626; color:white; border:none; border-radius:14px; font-weight:900; font-size:18px; cursor:pointer; width:100%; margin-bottom:12px;">✅ YAKIN SELESAI</button><button onclick="document.getElementById('popup-stop').style.display='none'" style="padding:18px; background:#fef3c7; color:#7f1d1d; border:1px solid #fde68a; border-radius:14px; font-weight:900; font-size:16px; cursor:pointer; width:100%;">❌ BATAL</button></div></div>
    <div id="popup-stop-teknis"><div class="box-popup" style="text-align:center;"><h2 style="color:#ea580c; margin-top:0;">⚠️ KONFIRMASI</h2><h3 style="margin-top:15px; margin-bottom: 25px;">Selesaikan Unit <span id="stop-teknis-unit-id" style="color:#ea580c;"></span>?</h3><button onclick="eksekusiStopTeknis()" style="padding:18px; background:#ea580c; color:white; border:none; border-radius:14px; font-weight:900; font-size:18px; cursor:pointer; width:100%; margin-bottom:12px;">✅ YAKIN SELESAI</button><button onclick="document.getElementById('popup-stop-teknis').style.display='none'" style="padding:18px; background:#fef3c7; color:#7f1d1d; border:1px solid #fde68a; border-radius:14px; font-weight:900; font-size:16px; cursor:pointer; width:100%;">❌ BATAL</button></div></div>
    <div id="popup-teknis"><div class="box-popup"><h3 style="text-align:center; margin-top:0; color:#7f1d1d;">UNIT <span id="mt-unit" style="color:#ea580c; font-weight:900;"></span></h3><button class="btn-tek" style="background:#059669; color:white;" onclick="prosesTeknis(0, '🎁 TUKAR KUPON')">🎁 TUKAR KUPON</button><button class="btn-tek" style="background:#ea580c; color:white;" onclick="prosesTeknis(10, '🔋 GANTI BATERAI')">🔋 GANTI BATERAI</button><button class="btn-tek" style="background:#dc2626; color:white;" onclick="prosesTeknis(10000, '🛠️ UNIT SERVIS')">🛠️ UNIT SERVIS</button><button class="btn-kembali" onclick="document.getElementById('popup-teknis').style.display='none'">❌ BATAL</button></div></div>
    <div id="popup-input"><div class="box-popup" style="text-align:center;"><h2 id="input-title" style="color:#7f1d1d; margin-top:0;"></h2><input type="text" id="input-value" class="input-box" style="margin-top:15px; margin-bottom:25px;" placeholder="..."><button onclick="eksekusiInput()" style="padding:18px; background:#7f1d1d; color:white; border:none; border-radius:14px; font-weight:900; font-size:18px; cursor:pointer; width:100%; margin-bottom:12px;">✅ OKE</button><button onclick="document.getElementById('popup-input').style.display='none'" style="padding:18px; background:#fef3c7; color:#7f1d1d; border:1px solid #fde68a; border-radius:14px; font-weight:900; font-size:16px; cursor:pointer; width:100%;">❌ BATAL</button></div></div>
    <div id="popup-nakal"><div class="box-popup" style="text-align: center;"><h2 style="color:#dc2626; margin-top:0;">⚠️ PERINGATAN!</h2><p id="teks-nakal" style="font-size:18px; font-weight:900; color:#451a03;"></p><p style="font-size:14px; color:#b45309; margin-bottom:25px;">Anak ini punya riwayat telat batas wajar.</p><button class="btn-tek" style="background:#f59e0b; color:white;" onclick="lanjutSewaNakal()">TETAP SEWAKAN</button><button class="btn-kembali" onclick="document.getElementById('popup-nakal').style.display='none'">BATAL</button></div></div>

    <script>
        // LINK SCRIPT FARRASAZZAM
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwOuip3sFKANwVlbawnZuDrw-MmWiJrkkqs9H3k2CAceBf55Nz-grDBitxELj7jRzbS8A/exec';
        
        // 10 UNIT FARRASAZZAM
        const units = [
            {id:"BU759", l:"https://rentals.ridebeam.com/solo/1e0d51cc-54c4-4b8e-be29-8948fb2ef4b9"},
            {id:"BR136", l:"https://rentals.ridebeam.com/solo/ca30fc09-8a5c-4f3c-bb34-a8311515cb8b"},
            {id:"BT689", l:"https://rentals.ridebeam.com/solo/7ce1be38-8d96-4914-984e-1ea9777f24e9"},
            {id:"BS222", l:"https://rentals.ridebeam.com/solo/92d1afec-0f6e-456e-b8d8-8c0d4bef7615"},
            {id:"BN104", l:"https://rentals.ridebeam.com/solo/d5a29535-da8f-496d-85da-40dde58481a4"},
            {id:"BU248", l:"https://rentals.ridebeam.com/solo/ffb4363f-119b-43ed-b35e-1fe978cea0c8"},
            {id:"BQ150", l:"https://rentals.ridebeam.com/solo/c36b4b9e-4fe5-4580-a135-c64018c97acd"},
            {id:"BT722", l:"https://rentals.ridebeam.com/solo/d5d286fe-acbc-4cb5-9cd3-c0fcde2639ec"},
            {id:"BR567", l:"https://rentals.ridebeam.com/solo/7e3b80ac-55b8-4400-a74d-c6a244e01f55"},
            {id:"BS917", l:"https://rentals.ridebeam.com/solo/8c7f8651-a2d2-4bc7-b496-6101f8ef0331"}
        ];

        let dataBusy = {}; let dataSewaSementara = {}; let tkId = "";
        let stopIdSementara = ""; let inputTipe = ""; let inputNama = "";

        function muat() { 
            fetch(scriptURL + "?action=ambilData&v=" + new Date().getTime(), {redirect: "follow"})
            .then(res => res.json()).then(res => { 
                document.getElementById('total').innerText = "Rp " + res.total.toLocaleString('id-ID'); 
                document.getElementById('total-pekan').innerText = "Rp " + res.totalPekan.toLocaleString('id-ID');
                
                dataBusy = res.busy; 
                let list = "";
                if(res.rusak && res.rusak.length > 0) {
                    res.rusak.forEach(r => {
                        list += `<div style="background:#fef2f2; padding:15px; margin-bottom:10px; border-left:6px solid #dc2626; border-radius:8px; color:#451a03;"><b>${r.unit}</b><br><span style="color:#b45309; font-size:14px;">${r.keluhan.replace('🛠️ UNIT SERVIS |', '').trim()}</span></div>`;
                    });
                } else { list = "<p style='color:#b45309; font-weight:bold;'>Semua unit siap tempur.</p>"; }
                document.getElementById('daftarRusak').innerHTML = list;
                updateTampilan(); 
            });
        }

        const c = document.getElementById('cont');
        c.innerHTML = '';
        units.forEach((u, i) => {
            // TATA LETAK 100% SAMA DENGAN BJRENTAL (Tombol Power di Header Unit)
            c.innerHTML += `
            <div class="card">
                <div class="unit-header">
                    <div class="unit-title">UNIT ${i+1}<br><span class="unit-id-text">${u.id}</span></div>
                    <div class="btn-actions">
                        <button class="btn-power" onclick="window.open('${u.l}','_blank')">⚡ POWER</button>
                        <button class="btn-teknis" onclick="tkId='${u.id}';document.getElementById('mt-unit').innerText='${u.id}';document.getElementById('popup-teknis').style.display='flex'">⚙️</button>
                    </div>
                </div>
                <div class="body-area">
                    <div class="btn-group">
                        <button class="k1 btn-harga" onclick="kirim('${u.id}',15,5000)">15m<br>5rb</button>
                        <button class="k2 btn-harga" onclick="kirim('${u.id}',30,10000)">30m<br>10rb</button>
                        <button class="k3 btn-harga" onclick="kirim('${u.id}',45,15000)">45m<br>15rb</button>
                        <button class="k4 btn-harga" onclick="kirim('${u.id}',60,20000)">60m<br>20rb</button>
                    </div>
                    <div class="overlay" id="ovl-${i}"></div>
                </div>
            </div>`;
        });

        function updateTampilan() {
            const sekarang = new Date();
            units.forEach((u, i) => {
                let ovl = document.getElementById("ovl-"+i); 
                let key = "SELIS " + u.id; // DISESUAIKAN DENGAN BACKEND BU TANIAH
                
                if(dataBusy[key]) {
                    ovl.style.display = "flex"; 
                    let info = dataBusy[key];
                    
                    let isKupon = info.nama.includes("🎁");
                    let isBaterai = info.nama.includes("🔋");
                    let isServis = info.nama.includes("🛠️");
                    
                    let statusTelat = false;
                    let timTeks = "--:--";
                    
                    if (!isBaterai && !isServis) {
                        let [h, m] = info.jam.split(':'); 
                        let target = new Date(); target.setHours(parseInt(h), parseInt(m), 0, 0);
                        let selisih = target.getTime() - sekarang.getTime(); 
                        statusTelat = selisih < 0; 
                        let totalDetik = Math.abs(Math.floor(selisih / 1000));
                        let mnt = Math.floor(totalDetik / 60); let dtk = totalDetik % 60;
                        timTeks = mnt + ":" + dtk.toString().padStart(2, '0');
                    }

                    if(isBaterai || isServis) {
                        ovl.style.background = isBaterai ? '#fff7ed' : '#fef2f2';
                        let borderColor = isBaterai ? '#fdba74' : '#fca5a5';
                        let textColor = isBaterai ? '#c2410c' : '#b91c1c';
                        ovl.style.border = '2px solid ' + borderColor;

                        ovl.innerHTML = `
                            <div style="color:${textColor}; width:100%; display:flex; flex-direction:column; align-items:center;">
                                <b style="font-size:16px;">UNIT ${i+1} (${u.id})</b><br><span style="font-weight:900;">${info.nama}</span><br>
                                <button onclick="stopTeknis('${u.id}')" style="background:${textColor}; color:white; border:none; padding:12px 30px; border-radius:12px; font-weight:900; cursor:pointer; width:85%; margin-top:10px;">✅ SELESAI</button>
                            </div>`;
                    } else {
                        ovl.style.background = isKupon ? '#ecfdf5' : 'white';
                        ovl.style.border = isKupon ? '1px solid #6ee7b7' : 'none';
                        let textColor = isKupon ? '#047857' : '#451a03';
                        let subTextColor = '#b45309';

                        let labelTelat = statusTelat ? `<div style="color:#dc2626; font-weight:900; font-size:13px; margin-bottom:4px; animation: blinker 0.6s linear infinite;">⚠️ LEWAT!</div>` : '';
                        let targetText = `<div style="font-size:12px; font-weight:bold; color:${subTextColor}; margin-top:6px;">Selesai: ${info.jam}</div>`;
                        let hargaDisplay = isKupon ? "GRATIS (KUPON)" : (info.harga ? "Rp " + parseInt(info.harga).toLocaleString('id-ID') : "Rp 0");
                        
                        ovl.innerHTML = `
                            <div class="zona-kiri" style="color:${textColor}; padding-left:10px;">
                                <span style="font-weight:900; font-size:17px; text-transform:uppercase;">${info.nama}</span><br>
                                <span style="font-weight:900; color:#ea580c; font-size:14px; margin-top:4px; display:inline-block;">${hargaDisplay}</span>
                            </div>
                            <div class="zona-tengah">
                                <button class="btn-stop" onclick="stopFinal('${u.id}')">STOP</button>
                            </div>
                            <div class="zona-kanan" style="padding-right:10px;">
                                ${labelTelat}
                                <div class="timer-badge ${statusTelat ? 'telat' : ''}">${statusTelat ? '-' : ''}${timTeks}</div>
                                ${targetText}
                            </div>
                        `;
                    }
                } else { ovl.style.display = "none"; }
            });
        }

        function kirim(id,d,h){
            let n = document.getElementById('nama').value; if(!n) return alert("MASUKKAN NAMA ANAK!");
            dataSewaSementara = {id, d, h, n};
            fetch(scriptURL + "?action=cekNakal&n=" + encodeURIComponent(n)).then(res => res.text()).then(t => {
                if(parseInt(t) >= 15) { 
                    document.getElementById('teks-nakal').innerText = n + " telat s/d " + t + " m!"; 
                    document.getElementById('popup-nakal').style.display = "flex"; 
                } else { eksekusiSimpanSewa(); }
            });
        }

        function eksekusiSimpanSewa(){
            let {id,d,h,n} = dataSewaSementara; let sls = new Date(new Date().getTime()+d*60000); 
            let j = sls.getHours().toString().padStart(2,'0')+":"+sls.getMinutes().toString().padStart(2,'0');
            fetch(`${scriptURL}?action=simpan&u=${id}&d=${d}&h=${h}&j=${j}&n=${encodeURIComponent(n)}`).then(res => res.text()).then(s => { 
                if(s=="SUKSES") { 
                    document.getElementById('jam-display').innerText=j; document.getElementById('popup').style.display="flex"; 
                } 
            });
        }

        function stopFinal(id) { stopIdSementara = id; document.getElementById('stop-unit-id').innerText = id; document.getElementById('popup-stop').style.display = 'flex'; }
        function eksekusiStop() { document.getElementById('popup-stop').style.display = 'none'; fetch(`${scriptURL}?action=selesai&id=${stopIdSementara}`).then(()=>muat()); }
        function stopTeknis(id) { stopIdSementara = id; document.getElementById('stop-teknis-unit-id').innerText = id; document.getElementById('popup-stop-teknis').style.display = 'flex'; }
        function eksekusiStopTeknis() { document.getElementById('popup-stop-teknis').style.display = 'none'; fetch(`${scriptURL}?action=selesai&id=${stopIdSementara}`).then(()=>muat()); }
        function tutupPopup(){ document.getElementById('popup').style.display="none"; document.getElementById('nama').value=""; muat(); }

        function prosesTeknis(dur,n){
            document.getElementById('popup-teknis').style.display='none'; 
            if(n.includes("🎁")){ 
                inputTipe = "KUPON"; inputNama = n; document.getElementById('input-title').innerText = "Berapa Menit Bonus?";
                document.getElementById('input-title').style.color = "#059669"; document.getElementById('input-value').type = "number";
                document.getElementById('input-value').value = ""; document.getElementById('popup-input').style.display = "flex"; return;
            }
            if(n.includes("🔋")){ 
                inputTipe = "BATERAI"; inputNama = n; document.getElementById('input-title').innerText = "Catatan Ganti Baterai?";
                document.getElementById('input-title').style.color = "#ea580c"; document.getElementById('input-value').type = "text";
                document.getElementById('input-value').value = ""; document.getElementById('popup-input').style.display = "flex"; return;
            }
            if(n.includes("🛠️")){ 
                inputTipe = "SERVIS"; inputNama = n; document.getElementById('input-title').innerText = "Rusak/Kendala Apa?";
                document.getElementById('input-title').style.color = "#dc2626"; document.getElementById('input-value').type = "text";
                document.getElementById('input-value').value = ""; document.getElementById('popup-input').style.display = "flex"; return;
            }
            lanjutProsesTeknis(dur, n);
        }

        function eksekusiInput() {
            let val = document.getElementById('input-value').value; if(!val) return alert("Tidak boleh kosong!");
            document.getElementById('popup-input').style.display = 'none';
            let dur = 0; let n = inputNama;
            if(inputTipe === "KUPON") { dur = parseInt(val); }
            else if (inputTipe === "BATERAI") { n = "🔋 GANTI BATERAI | " + val; dur = 10; }
            else if (inputTipe === "SERVIS") { n = "🛠️ UNIT SERVIS | " + val; dur = 10000; }
            lanjutProsesTeknis(dur, n);
        }

        function lanjutProsesTeknis(dur, n) {
            let sls = new Date(new Date().getTime() + dur * 60000); 
            let j = (n.includes("🛠️") || n.includes("🔋")) ? "--" : sls.getHours().toString().padStart(2,'0') + ":" + sls.getMinutes().toString().padStart(2,'0');
            fetch(`${scriptURL}?action=simpan&u=${tkId}&d=${dur}&h=0&j=${j}&n=${encodeURIComponent(n)}`).then(res => res.text()).then(s => { 
                if (s === "SUKSES" && n.includes("🎁")) { document.getElementById('jam-display').innerText = j; document.getElementById('popup').style.display = "flex"; } 
                else { muat(); }
            });
        }

        function lanjutSewaNakal(){ document.getElementById('popup-nakal').style.display="none"; eksekusiSimpanSewa(); }
        setInterval(updateTampilan, 1000); setInterval(muat, 60000);
    </script>
</body>
</html>
